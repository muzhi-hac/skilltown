openapi: 3.1.0
info:
  title: SkillTown Learning API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health
      operationId: healthCheck
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      summary: Ready
      operationId: readinessCheck
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/v1/session:
    post:
      summary: Create Session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Session
      operationId: deleteSession
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/town:
    get:
      summary: Get Town
      operationId: getTown
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TownResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/attempts:
    post:
      summary: Create Attempt
      operationId: createAttempt
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttemptRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/attempts/{attempt_id}:
    get:
      summary: Get Attempt
      operationId: getAttempt
      parameters:
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attempt Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/attempts/{attempt_id}/respond:
    post:
      summary: Respond
      operationId: respondToAttempt
      parameters:
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attempt Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ChoiceResponseRequest'
              - $ref: '#/components/schemas/TextResponseRequest'
              discriminator:
                propertyName: kind
                mapping:
                  choice: '#/components/schemas/ChoiceResponseRequest'
                  text: '#/components/schemas/TextResponseRequest'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/attempts/{attempt_id}/hint:
    post:
      summary: Request Hint
      operationId: requestHint
      parameters:
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attempt Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HintResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/attempts/{attempt_id}/rewind:
    post:
      summary: Rewind
      operationId: rewindAttempt
      parameters:
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attempt Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/attempts/{attempt_id}/activity:
    post:
      summary: Record Activity
      operationId: recordActivity
      parameters:
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attempt Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/passport:
    get:
      summary: Get Passport
      operationId: getPassport
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassportResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recommendations:
    post:
      summary: Recommendations
      operationId: generateRecommendations
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActivityRequest:
      properties:
        client_event_id:
          type: string
          format: uuid
          title: Client Event Id
        kind:
          type: string
          enum:
          - start
          - heartbeat
          - pause
          - resume
          - end
          title: Kind
      additionalProperties: false
      type: object
      required:
      - client_event_id
      - kind
      title: ActivityRequest
    AttemptMode:
      type: string
      enum:
      - practice
      - verification
      title: AttemptMode
    AttemptResponse:
      properties:
        attempt_id:
          type: string
          format: uuid
          title: Attempt Id
        scenario_id:
          type: string
          title: Scenario Id
        scenario_version:
          type: string
          title: Scenario Version
        mode:
          $ref: '#/components/schemas/AttemptMode'
        status:
          $ref: '#/components/schemas/AttemptStatus'
        revision:
          type: integer
          minimum: 0.0
          title: Revision
        assisted:
          type: boolean
          title: Assisted
        node:
          anyOf:
          - $ref: '#/components/schemas/ScenarioNode'
          - type: 'null'
        feedback:
          anyOf:
          - $ref: '#/components/schemas/Feedback'
          - type: 'null'
        effect:
          $ref: '#/components/schemas/Effect'
        learning_updates:
          items:
            $ref: '#/components/schemas/LearningUpdate'
          type: array
          title: Learning Updates
        is_complete:
          type: boolean
          title: Is Complete
        feedback_mode:
          $ref: '#/components/schemas/FeedbackMode'
        assessment_status:
          type: string
          enum:
          - assessed
          - deferred
          - not_requested
          title: Assessment Status
          default: not_requested
        dialogue:
          items:
            $ref: '#/components/schemas/DialogueTurn'
          type: array
          title: Dialogue
        pressure:
          anyOf:
          - $ref: '#/components/schemas/Pressure'
          - type: 'null'
        timing:
          $ref: '#/components/schemas/Timing'
      additionalProperties: false
      type: object
      required:
      - attempt_id
      - scenario_id
      - scenario_version
      - mode
      - status
      - revision
      - assisted
      - node
      - effect
      - is_complete
      - feedback_mode
      - timing
      title: AttemptResponse
    AttemptStatus:
      type: string
      enum:
      - in_progress
      - completed
      - abandoned
      title: AttemptStatus
    CategoryView:
      properties:
        id:
          $ref: '#/components/schemas/LearningCategory'
        label:
          type: string
          title: Label
        icon:
          type: string
          title: Icon
      additionalProperties: false
      type: object
      required:
      - id
      - label
      - icon
      title: CategoryView
    Choice:
      properties:
        id:
          type: string
          title: Id
        label:
          type: string
          maxLength: 240
          title: Label
      additionalProperties: false
      type: object
      required:
      - id
      - label
      title: Choice
    ChoiceResponseRequest:
      properties:
        client_event_id:
          type: string
          format: uuid
          title: Client Event Id
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
        kind:
          type: string
          const: choice
          title: Kind
        choice_id:
          type: string
          title: Choice Id
      additionalProperties: false
      type: object
      required:
      - client_event_id
      - expected_revision
      - kind
      - choice_id
      title: ChoiceResponseRequest
    ConsequenceBeat:
      properties:
        when:
          type: string
          maxLength: 80
          title: When
        text:
          type: string
          maxLength: 400
          title: Text
      additionalProperties: false
      type: object
      required:
      - when
      - text
      title: ConsequenceBeat
      description: One step of what happens after the learner gives way.
    CreateAttemptRequest:
      properties:
        scenario_id:
          type: string
          title: Scenario Id
        mode:
          $ref: '#/components/schemas/AttemptMode'
      additionalProperties: false
      type: object
      required:
      - scenario_id
      - mode
      title: CreateAttemptRequest
    CreateSessionRequest:
      properties:
        display_name:
          type: string
          maxLength: 40
          minLength: 1
          title: Display Name
      additionalProperties: false
      type: object
      required:
      - display_name
      title: CreateSessionRequest
    CreateSessionResponse:
      properties:
        session_token:
          type: string
          title: Session Token
        session:
          $ref: '#/components/schemas/SessionView'
      additionalProperties: false
      type: object
      required:
      - session_token
      - session
      title: CreateSessionResponse
    DialogueTurn:
      properties:
        node_id:
          type: string
          title: Node Id
        speaker:
          type: string
          enum:
          - npc
          - learner
          title: Speaker
        text:
          type: string
          maxLength: 1200
          title: Text
        kind:
          type: string
          enum:
          - line
          - probe
          - answer
          - decision
          - commit
          title: Kind
          default: line
        resolved:
          type: boolean
          title: Resolved
          default: false
      additionalProperties: false
      type: object
      required:
      - node_id
      - speaker
      - text
      title: DialogueTurn
    Effect:
      type: string
      enum:
      - none
      - consequence_preview
      - rewind_available
      - completed
      title: Effect
    EvidenceView:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        skill_id:
          $ref: '#/components/schemas/SkillId'
        scenario_id:
          type: string
          title: Scenario Id
        node_id:
          type: string
          title: Node Id
        observed_response:
          type: string
          title: Observed Response
        interpretation:
          anyOf:
          - type: string
          - type: 'null'
          title: Interpretation
        policy_clause_ids:
          items:
            type: string
          type: array
          title: Policy Clause Ids
        assisted:
          type: boolean
          title: Assisted
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - skill_id
      - scenario_id
      - node_id
      - observed_response
      - interpretation
      - policy_clause_ids
      - assisted
      - created_at
      title: EvidenceView
    Feedback:
      properties:
        title:
          type: string
          title: Title
        message:
          type: string
          maxLength: 1200
          title: Message
        mode:
          $ref: '#/components/schemas/FeedbackMode'
        policy_clauses:
          items:
            $ref: '#/components/schemas/PolicyCard'
          type: array
          title: Policy Clauses
      additionalProperties: false
      type: object
      required:
      - title
      - message
      - mode
      title: Feedback
    FeedbackMode:
      type: string
      enum:
      - scripted
      - ai
      - fallback
      title: FeedbackMode
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        version:
          type: string
          title: Version
          default: 1.0.0
      additionalProperties: false
      type: object
      title: HealthResponse
    HintResponse:
      properties:
        attempt_id:
          type: string
          format: uuid
          title: Attempt Id
        revision:
          type: integer
          title: Revision
        assisted:
          type: boolean
          const: true
          title: Assisted
          default: true
        hint:
          type: string
          title: Hint
        policy_card:
          $ref: '#/components/schemas/PolicyCard'
      additionalProperties: false
      type: object
      required:
      - attempt_id
      - revision
      - hint
      - policy_card
      title: HintResponse
    LearningCategory:
      type: string
      enum:
      - ethics_compliance
      - personal_development
      title: LearningCategory
    LearningState:
      type: string
      enum:
      - unseen
      - needs_practice
      - practiced
      - demonstrated
      title: LearningState
    LearningUpdate:
      properties:
        skill_id:
          $ref: '#/components/schemas/SkillId'
        state:
          $ref: '#/components/schemas/LearningState'
        evidence_id:
          type: string
          format: uuid
          title: Evidence Id
        assisted:
          type: boolean
          title: Assisted
      additionalProperties: false
      type: object
      required:
      - skill_id
      - state
      - evidence_id
      - assisted
      title: LearningUpdate
    MutationRequest:
      properties:
        client_event_id:
          type: string
          format: uuid
          title: Client Event Id
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
      additionalProperties: false
      type: object
      required:
      - client_event_id
      - expected_revision
      title: MutationRequest
    NpcId:
      type: string
      enum:
      - alex
      - sam
      - nina
      - mira
      - jo
      title: NpcId
    PassportResponse:
      properties:
        skills:
          items:
            $ref: '#/components/schemas/SkillPassportEntry'
          type: array
          title: Skills
        total_active_seconds:
          type: integer
          minimum: 0.0
          title: Total Active Seconds
        total_model_wait_seconds:
          type: integer
          minimum: 0.0
          title: Total Model Wait Seconds
      additionalProperties: false
      type: object
      required:
      - skills
      - total_active_seconds
      - total_model_wait_seconds
      title: PassportResponse
    PolicyCard:
      properties:
        clause_id:
          type: string
          title: Clause Id
        title:
          type: string
          title: Title
        text:
          type: string
          title: Text
        fictional:
          type: boolean
          title: Fictional
          default: false
        source:
          type: string
          title: Source
          default: ''
      additionalProperties: false
      type: object
      required:
      - clause_id
      - title
      - text
      title: PolicyCard
    Position:
      properties:
        x:
          type: number
          title: X
        y:
          type: number
          title: Y
      additionalProperties: false
      type: object
      required:
      - x
      - y
      title: Position
    Pressure:
      properties:
        turn:
          type: integer
          minimum: 0.0
          title: Turn
        max_turns:
          type: integer
          minimum: 1.0
          title: Max Turns
        active:
          type: boolean
          title: Active
      additionalProperties: false
      type: object
      required:
      - turn
      - max_turns
      - active
      title: Pressure
      description: Where the learner stands in one character's escalation.
    ReadyResponse:
      properties:
        ready:
          type: boolean
          title: Ready
        retrieval_mode:
          type: string
          enum:
          - hybrid
          - sparse
          - unavailable
          title: Retrieval Mode
        chunk_count:
          type: integer
          minimum: 0.0
          title: Chunk Count
        model_revision:
          type: string
          title: Model Revision
        reason:
          type: string
          title: Reason
      additionalProperties: false
      type: object
      required:
      - ready
      - retrieval_mode
      - chunk_count
      - model_revision
      - reason
      title: ReadyResponse
    RecommendationRequest:
      properties:
        max_items:
          type: integer
          maximum: 3.0
          minimum: 1.0
          title: Max Items
          default: 3
      additionalProperties: false
      type: object
      title: RecommendationRequest
    RecommendationResponse:
      properties:
        generated_at:
          type: string
          format: date-time
          title: Generated At
        items:
          items:
            $ref: '#/components/schemas/RecommendationView'
          type: array
          maxItems: 3
          title: Items
      additionalProperties: false
      type: object
      required:
      - generated_at
      - items
      title: RecommendationResponse
    RecommendationView:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        scenario_id:
          type: string
          title: Scenario Id
        npc_id:
          $ref: '#/components/schemas/NpcId'
        skill_id:
          $ref: '#/components/schemas/SkillId'
        reason:
          type: string
          maxLength: 500
          title: Reason
        evidence_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Evidence Ids
      additionalProperties: false
      type: object
      required:
      - id
      - scenario_id
      - npc_id
      - skill_id
      - reason
      - evidence_ids
      title: RecommendationView
    ScenarioNode:
      properties:
        id:
          type: string
          title: Id
        npc_id:
          $ref: '#/components/schemas/NpcId'
        category:
          $ref: '#/components/schemas/LearningCategory'
        text:
          type: string
          maxLength: 1200
          title: Text
        line:
          type: string
          maxLength: 600
          title: Line
          default: ''
        choices:
          items:
            $ref: '#/components/schemas/Choice'
          type: array
          maxItems: 4
          title: Choices
        allow_text:
          type: boolean
          title: Allow Text
        policy_cards:
          items:
            $ref: '#/components/schemas/PolicyCard'
          type: array
          title: Policy Cards
        consequence:
          items:
            $ref: '#/components/schemas/ConsequenceBeat'
          type: array
          maxItems: 5
          title: Consequence
      additionalProperties: false
      type: object
      required:
      - id
      - npc_id
      - category
      - text
      - choices
      - allow_text
      title: ScenarioNode
    SessionView:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        display_name:
          type: string
          title: Display Name
        expires_at:
          type: string
          format: date-time
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - id
      - display_name
      - expires_at
      title: SessionView
    SkillId:
      type: string
      enum:
      - clarify_context
      - conflict_awareness
      - communicate_boundary
      title: SkillId
    SkillPassportEntry:
      properties:
        skill_id:
          $ref: '#/components/schemas/SkillId'
        label:
          type: string
          title: Label
        state:
          $ref: '#/components/schemas/LearningState'
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceView'
          type: array
          title: Evidence
      additionalProperties: false
      type: object
      required:
      - skill_id
      - label
      - state
      - evidence
      title: SkillPassportEntry
    TaskSummary:
      properties:
        scenario_id:
          type: string
          title: Scenario Id
        title:
          type: string
          title: Title
        category:
          $ref: '#/components/schemas/LearningCategory'
        estimated_minutes:
          type: integer
          maximum: 15.0
          minimum: 1.0
          title: Estimated Minutes
        available_modes:
          items:
            $ref: '#/components/schemas/AttemptMode'
          type: array
          title: Available Modes
      additionalProperties: false
      type: object
      required:
      - scenario_id
      - title
      - category
      - estimated_minutes
      - available_modes
      title: TaskSummary
    TextResponseRequest:
      properties:
        client_event_id:
          type: string
          format: uuid
          title: Client Event Id
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
        kind:
          type: string
          const: text
          title: Kind
        text:
          type: string
          maxLength: 1000
          minLength: 1
          title: Text
      additionalProperties: false
      type: object
      required:
      - client_event_id
      - expected_revision
      - kind
      - text
      title: TextResponseRequest
    Timing:
      properties:
        active_seconds:
          type: integer
          minimum: 0.0
          title: Active Seconds
        model_wait_seconds:
          type: integer
          minimum: 0.0
          title: Model Wait Seconds
      additionalProperties: false
      type: object
      required:
      - active_seconds
      - model_wait_seconds
