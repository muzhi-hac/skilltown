name: deploy-pages

# 页面（静态 Godot 构建）部署到 Cloudflare Pages。
# 后端 /api/* 由 cloudflare/_worker.js 反代到 Pages 环境变量 API_ORIGIN。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["godot/**", "cloudflare/**", ".github/workflows/deploy-pages.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.5-stable
    steps:
      - uses: actions/checkout@v4
      - name: 复用 ci 的 Godot 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: 安装 Godot（缓存未命中时）
        run: |
          set -euo pipefail
          test -x ~/godot/godot && exit 0
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
      - name: 导出并放入代理 worker
        run: |
          mkdir -p godot/web
          ~/godot/godot --headless --path godot --export-release "Web" web/index.html
          cp cloudflare/_worker.js godot/web/_worker.js
      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy godot/web --project-name=skilltown
