name: deploy-fly

# Build the web client, bake it into the image, deploy to Fly.io (one machine,
# one persistent volume, one origin). Needs the FLY_API_TOKEN repo secret.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build the client
        working-directory: client
        run: |
          npm ci
          npm run build
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
      - name: Smoke-test the deployed URL
        run: |
          set -euo pipefail
          app=$(awk -F'"' '/^app =/{print $2}' fly.toml)
          url="https://$app.fly.dev"
          # The machine may still be booting when deploy returns.
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$url/health" >/dev/null 2>&1; then
              echo "health check passed on attempt ${i}"
              break
            fi
            if [ "$i" = 30 ]; then
              echo "timed out waiting for $url/health" >&2
              exit 1
            fi
            sleep 5
          done
          python3 tools/smoke_api.py "$url"
