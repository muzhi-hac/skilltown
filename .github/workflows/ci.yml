name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r server/requirements.txt
      - name: pytest
        run: python -m pytest server/tests -q

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and typecheck the client
        working-directory: client
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
      - name: Build the client
        working-directory: client
        run: npm run build
      - name: Acceptance test in a real browser against a real server
        env:
          CHROME: google-chrome
          DATABASE_PATH: /tmp/ci.sqlite3
          WEB_DIR: client/dist
          SKILLTOWN_MODEL_ENABLED: "false"
        run: |
          pip install -r server/requirements.txt websocket-client
          python -m uvicorn server.main:app --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ready && break || sleep 1; done
          python tools/e2e_room.py http://127.0.0.1:8000
          python tools/smoke_api.py http://127.0.0.1:8000
      - uses: actions/upload-artifact@v4
        with:
          name: skilltown-client
          path: client/dist

  image:
    runs-on: ubuntu-latest
    needs: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build the client for the image
        working-directory: client
        run: |
          npm ci
          npm run build
      - name: Build the pinned dense-RAG image
        run: docker build -t skilltown:rag-check .
      - name: Verify image corpus and offline hybrid warmup
        run: |
          docker run --rm --network none skilltown:rag-check python -c '\
          from pathlib import Path; from server.core.knowledge import corpus; from server.core.rag_runtime import warmup_rag; \
          p=Path("/app/server/content/knowledge"); assert (p/"eu_regulation_reference.md").is_file(); assert (p/"eu_thresholds_annex.md").is_file(); \
          s=warmup_rag(True); assert len(corpus()) > 0 and s.ready and s.retrieval_mode == "hybrid"; print(s)'
          docker run --rm --network none --memory=512m skilltown:rag-check python -m server.rag_release_probe
      - name: Verify HTTP readiness in the 512MB image
        run: |
          docker run -d --rm --name skilltown-rag-ci --memory=512m -e SKILLTOWN_MODEL_ENABLED=false -p 8000:8000 skilltown:rag-check
          trap 'docker stop skilltown-rag-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/ready && exit 0 || sleep 1; done
          exit 1
