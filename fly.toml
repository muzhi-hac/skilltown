# SkillTown on Fly.io: one machine, one volume, one origin.
#
# SQLite has a single writer and a Fly volume attaches to exactly one machine,
# so this app must stay at one machine. Do not scale it out: a second machine
# would either fail to mount the volume or serve a different, diverging copy of
# the learners' evidence.
#
# The app name is globally unique; change it to the one you registered.
app = "skilltown"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/skilltown.sqlite3"
  WEB_DIR = "/app/client/dist"
  # Same-origin deployment, so CORS does not apply; empty avoids a misconfig.
  CORS_ORIGINS = ""
  # Real model evaluation is on. Verified 2026-09-10 with one live call through
  # the configured gateway: a plain text call and the structured rubric call both
  # returned 200, and the verdict quoted the learner's own words.
  SKILLTOWN_MODEL_ENABLED = "true"
  # That gateway refuses the SDK's default client identity and serves plain HTTP
  # clients, so the operator sets the header explicitly. Unset it when moving to a
  # first-party ANTHROPIC_API_KEY - it is not needed there, and this gateway's
  # client policy can change at any time.
  SKILLTOWN_MODEL_USER_AGENT = "curl/8.4.0"
  # Every step is now a free-text answer, so the learner waits for one evaluation
  # per step. Opus 5 measured ~12s per answer on this endpoint, which is too long
  # to sit through repeatedly, so the demo runs Sonnet 5. Effort stays at the
  # code default; only the model changed.
  SKILLTOWN_MODEL = "claude-sonnet-5"
  SKILLTOWN_REQUIRE_DENSE = "true"

[http_service]
  internal_port = 8000
  force_https = true
  # Kept warm during the demo so a cold start never lands mid-pitch.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/ready"

[[mounts]]
  source = "skilltown_data"
  destination = "/data"
  initial_size = "1gb"

[deploy]
  # One machine with one volume cannot blue-green: expect a few seconds of
  # downtime per deploy.
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
