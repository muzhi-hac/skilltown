# SkillTown on Fly.io: one machine, one volume, one origin.
#
# SQLite has a single writer and a Fly volume attaches to exactly one machine,
# so this app must stay at one machine. Do not scale it out: a second machine
# would either fail to mount the volume or serve a different, diverging copy of
# the learners' evidence.
#
# app 名称需全局唯一，部署前改成你注册的名字。
app = "skilltown"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/skilltown.sqlite3"
  WEB_DIR = "/app/godot/web"
  # 同源部署，CORS 不参与；留空避免误配。
  CORS_ORIGINS = ""
  # Real model evaluation is on. Verified 2026-09-10 with one live call through
  # the configured gateway: a plain text call and the structured rubric call both
  # returned 200, and the verdict quoted the learner's own words.
  SKILLTOWN_MODEL_ENABLED = "true"
  # That gateway refuses the SDK's default client identity and serves plain HTTP
  # clients, so the operator sets the header explicitly. Unset it when moving to a
  # first-party ANTHROPIC_API_KEY - it is not needed there, and this gateway's
  # client policy can change at any time.
  SKILLTOWN_MODEL_USER_AGENT = "curl/8.4.0"

[http_service]
  internal_port = 8000
  force_https = true
  # 演示期间保持常驻，避免冷启动出现在路演中间。
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "skilltown_data"
  destination = "/data"
  initial_size = "1gb"

[deploy]
  # 单机 + 单卷无法蓝绿或滚动：部署时会有几秒不可用。
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
